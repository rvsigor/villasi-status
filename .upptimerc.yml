# Configuração do Upptime para status.villasi.com.br (requirements.md §6.4, design.md §9.5).
# Este arquivo vai para a raiz do repositório rvsigor/villasi-status, criado a partir do
# modelo upptime/upptime. O Upptime roda no GitHub Actions e publica a página no GitHub Pages,
# fora do Render: se o sistema cair, a página de status continua no ar.
owner: rvsigor
repo: villasi-status

sites:
  - name: Sistema (painel)
    url: https://painel.villasi.com.br/api/saude
    expectedStatusCodes:
      - 200
  - name: Página do Villasi
    url: https://www.villasi.com.br
  - name: Central de ajuda
    url: https://help.villasi.com.br

status-website:
  cname: status.villasi.com.br
  name: Situação do Villasi
  introTitle: "Situação do **Villasi**"
  introMessage: Aqui você vê se o sistema está funcionando e o histórico de quedas. Se algo estiver fora do ar, já estamos cuidando.
  logoUrl: https://www.villasi.com.br/marca/villasi-simbolo.svg
  favicon: https://www.villasi.com.br/favicon.svg
  theme: light
  navbar:
    - title: Status
      href: /
    - title: Ajuda
      href: https://help.villasi.com.br
    - title: Entrar
      href: https://painel.villasi.com.br
  i18n:
    up: Funcionando
    down: Fora do ar
    degraded: Lento
    operational: Todos os sistemas funcionando
    liveStatus: Situação agora
    pastIncidents: Ocorrências anteriores
    allSystemsOperational: Todos os sistemas funcionando
    activeIncidents: Problemas em andamento
    averageResponseTime: Tempo médio de resposta

workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "0 */6 * * *"
  graphs: "0 0 * * *"
  staticSite: "0 1 * * *"
  summary: "0 0 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
